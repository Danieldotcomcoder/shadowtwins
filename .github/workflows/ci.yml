name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv python install 3.12
      - run: uv sync --frozen --extra research
      - run: uv run ruff check src tests tools
      - run: uv run pyright
      - run: uv run pytest -q -o addopts="" -p no:warnings
      - run: uv run shadowtwins export-contracts --check
      - run: uv run benchserver export-openapi --check
      - name: Independently re-verify every shipped certificate
        run: uv run shadowtwins-verify --jobs 4 packs/shadowtwins-ranked-v1 packs/shadowtwins-practice-v1 packs/shadowtwins-dev-v1

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv python install 3.12 && uv sync --frozen
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend e2e

  container:
    runs-on: ubuntu-24.04
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
      - run: uv python install 3.12 && uv sync --frozen
      - run: docker build -t shadowtwins:ci .
      - run: uv run python tools/container_acceptance.py --image shadowtwins:ci
