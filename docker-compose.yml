# One command: `docker compose up -d` (after copying .env.example to .env).
services:
  shadowtwins:
    build: .
    image: shadowtwins:0.1.0
    container_name: shadowtwins
    ports:
      - "127.0.0.1:8000:8000"   # bind to localhost; put a TLS proxy in front for remote access
    env_file: .env
    volumes:
      - shadowtwins-data:/data
    stop_grace_period: 40s
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  shadowtwins-data: {}
